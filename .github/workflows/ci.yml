# Type check and lint on every push and pull request.
#
# Added after a five-month gap in which the local type check was silently broken
# by iCloud conflict copies and nobody noticed, because nothing ran it. A clean
# checkout here has neither the iCloud duplicates nor the 15-minute node_modules
# traversal, so this is both the authoritative check and the fast one.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Lint
        run: npx next lint
